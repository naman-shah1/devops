apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-lite
  labels:
    app: shopflow-lite
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: shopflow-lite
  template:
    metadata:
      labels:
        app: shopflow-lite
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: dockerhub-pull-secret
      containers:
      - name: shopflow-lite
        image: docker.io/namanshah30/shopflow-lite:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secret
              key: url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secret
              key: key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
