apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopflow-lite
  template:
    metadata:
      labels:
        app: shopflow-lite
    spec:
      containers:
      - name: shopflow-lite
        image: your-registry.com/shopflow-lite:latest
        ports:
        - containerPort: 5000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: shopflow-secret
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: shopflow-secret
              key: SUPABASE_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
