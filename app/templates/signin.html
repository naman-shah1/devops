{% extends "base.html" %}

{% block title %}Sign in — ShopFlow Lite{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="signin-heading">
    <div class="auth-card">
        <h1 class="page-title" id="signin-heading">Create your account</h1>
        <p class="page-sub">Sign up once and keep your checkout flow simple in this demo app.</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <label class="form-field">
                <span>Username</span>
                <input class="input-field" type="text" name="username" value="{{ username|default('') }}" autocomplete="username" autofocus>
            </label>

            <label class="form-field">
                <span>Password</span>
                <input class="input-field" type="password" name="password" autocomplete="new-password">
            </label>

            <label class="form-field">
                <span>Confirm password</span>
                <input class="input-field" type="password" name="confirm_password" autocomplete="new-password">
            </label>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login instead</a>.
        </p>
    </div>
</section>
{% endblock %}
