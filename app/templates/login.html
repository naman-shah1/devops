{% extends "base.html" %}

{% block title %}Login — ShopFlow Lite{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="login-heading">
    <div class="auth-card">
        <h1 class="page-title" id="login-heading">Login to ShopFlow Lite</h1>
        <p class="page-sub">Sign in to continue shopping and view your session history.</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <label class="form-field">
                <span>Username</span>
                <input class="input-field" type="text" name="username" value="{{ username|default('') }}" autocomplete="username" autofocus>
            </label>

            <label class="form-field">
                <span>Password</span>
                <input class="input-field" type="password" name="password" autocomplete="current-password">
            </label>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-footer">
            New to ShopFlow Lite? <a href="{{ url_for('signin') }}">Create an account</a>.
        </p>
    </div>
</section>
{% endblock %}
